<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 290" width="200" height="290">
  <defs>
    <linearGradient id="bgBP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000d1a"/>
      <stop offset="50%" stop-color="#001f3f"/>
      <stop offset="100%" stop-color="#000508"/>
    </linearGradient>
    <linearGradient id="paintSplash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6eff"/>
      <stop offset="50%" stop-color="#0044cc"/>
      <stop offset="100%" stop-color="#66aaff"/>
    </linearGradient>
    <linearGradient id="spineBP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0055cc"/>
      <stop offset="100%" stop-color="#66aaff"/>
    </linearGradient>
    <filter id="glowBP">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="paintBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="coverClip">
      <rect width="200" height="290"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="200" height="290" fill="url(#bgBP)"/>

  <!-- Paint splatter blobs - background layer -->
  <ellipse cx="160" cy="60" rx="35" ry="20" fill="#1a6eff" opacity="0.15" filter="url(#paintBlur)" transform="rotate(-20,160,60)"/>
  <ellipse cx="30" cy="180" rx="25" ry="15" fill="#0044cc" opacity="0.2" filter="url(#paintBlur)" transform="rotate(15,30,180)"/>
  <ellipse cx="120" cy="220" rx="40" ry="18" fill="#66aaff" opacity="0.12" filter="url(#paintBlur)" transform="rotate(10,120,220)"/>

  <!-- Canvas / sketchbook shape in center -->
  <rect x="35" y="45" width="130" height="155" rx="3" fill="#f5f0e8" opacity="0.92"/>
  <rect x="35" y="45" width="130" height="8" rx="3" fill="#d4c9b0" opacity="0.9"/>
  <!-- Canvas texture lines -->
  <line x1="35" y1="53" x2="165" y2="53" stroke="#c8bda0" stroke-width="0.5" opacity="0.6"/>

  <!-- Abstract painting on canvas - cityscape in blue -->
  <!-- Sky on canvas -->
  <rect x="35" y="53" width="130" height="90" fill="#c8dcf5"/>
  <!-- Buildings silhouette -->
  <rect x="35" y="105" width="15" height="38" fill="#2a4a7f"/>
  <rect x="48" y="95" width="12" height="48" fill="#1e3a6e"/>
  <rect x="58" y="110" width="10" height="33" fill="#2a4a7f"/>
  <rect x="66" y="100" width="14" height="43" fill="#162d5a"/>
  <rect x="78" y="108" width="11" height="35" fill="#1e3a6e"/>
  <rect x="87" y="90" width="16" height="53" fill="#0f2244"/>
  <rect x="101" y="103" width="12" height="40" fill="#1e3a6e"/>
  <rect x="111" y="97" width="14" height="46" fill="#162d5a"/>
  <rect x="123" y="112" width="10" height="31" fill="#2a4a7f"/>
  <rect x="131" y="104" width="13" height="39" fill="#1e3a6e"/>
  <rect x="142" y="115" width="11" height="28" fill="#2a4a7f"/>
  <rect x="151" y="108" width="14" height="35" fill="#162d5a"/>
  <!-- Ground -->
  <rect x="35" y="138" width="130" height="5" fill="#0a1a3a"/>
  <!-- Reflection in water -->
  <rect x="35" y="143" width="130" height="65" fill="#1a2a4a"/>
  <rect x="50" y="143" width="8" height="50" fill="#2a4a7f" opacity="0.5"/>
  <rect x="80" y="143" width="14" height="55" fill="#0f2244" opacity="0.5"/>
  <rect x="120" y="143" width="10" height="48" fill="#1e3a6e" opacity="0.5"/>

  <!-- Paint strokes on canvas (artistic overlay) -->
  <ellipse cx="100" cy="100" rx="60" ry="45" fill="none" stroke="#1a6eff" stroke-width="3" opacity="0.3" stroke-dasharray="5,8"/>
  
  <!-- Blue paint drip from top of canvas -->
  <rect x="72" y="45" width="6" height="20" rx="3" fill="#1a6eff" opacity="0.85"/>
  <ellipse cx="75" cy="65" rx="4" ry="5" fill="#1a6eff" opacity="0.85"/>
  <rect x="118" y="45" width="5" height="28" rx="2" fill="#0044cc" opacity="0.8"/>
  <ellipse cx="120" cy="73" rx="3.5" ry="4" fill="#0044cc" opacity="0.8"/>

  <!-- Paint palette at bottom of canvas -->
  <ellipse cx="55" cy="190" rx="16" ry="9" fill="#e8dcc8" stroke="#d4c4a0" stroke-width="1"/>
  <circle cx="49" cy="188" r="3" fill="#1a6eff"/>
  <circle cx="57" cy="186" r="2.5" fill="#ffffff"/>
  <circle cx="63" cy="190" r="2" fill="#ffcc00"/>
  <circle cx="53" cy="193" r="2.5" fill="#cc3300"/>

  <!-- Paintbrush -->
  <line x1="65" y1="210" x2="90" y2="175" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <line x1="63" y1="212" x2="68" y2="207" stroke="#5a4010" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="90" cy="174" rx="4" ry="7" fill="#1a6eff" transform="rotate(-35,90,174)"/>

  <!-- Scattered paint drops outside canvas -->
  <circle cx="25" cy="80" r="4" fill="#1a6eff" opacity="0.7"/>
  <circle cx="22" cy="92" r="2" fill="#66aaff" opacity="0.6"/>
  <circle cx="175" cy="130" r="5" fill="#0044cc" opacity="0.65"/>
  <circle cx="178" cy="120" r="2.5" fill="#1a6eff" opacity="0.5"/>
  <circle cx="170" cy="145" r="3" fill="#66aaff" opacity="0.55"/>
  <circle cx="30" cy="160" r="3.5" fill="#0055cc" opacity="0.6"/>

  <!-- Left spine stripe -->
  <rect x="0" y="0" width="6" height="290" fill="url(#spineBP)"/>

  <!-- Genre badge -->
  <rect x="14" y="14" width="55" height="18" rx="9" fill="#0055cc" opacity="0.9"/>
  <text x="41" y="26.5" text-anchor="middle" font-family="'Rajdhani','Arial',sans-serif"
    font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1.5">SEINEN</text>

  <!-- Corner decorations -->
  <line x1="8" y1="8" x2="30" y2="8" stroke="#66aaff" stroke-width="1.5"/>
  <line x1="8" y1="8" x2="8" y2="30" stroke="#66aaff" stroke-width="1.5"/>
  <line x1="192" y1="8" x2="170" y2="8" stroke="#66aaff" stroke-width="1.5"/>
  <line x1="192" y1="8" x2="192" y2="30" stroke="#66aaff" stroke-width="1.5"/>
  <line x1="8" y1="282" x2="30" y2="282" stroke="#66aaff" stroke-width="1.5"/>
  <line x1="8" y1="282" x2="8" y2="260" stroke="#66aaff" stroke-width="1.5"/>
  <line x1="192" y1="282" x2="170" y2="282" stroke="#66aaff" stroke-width="1.5"/>
  <line x1="192" y1="282" x2="192" y2="260" stroke="#66aaff" stroke-width="1.5"/>

  <!-- Title area background -->
  <rect x="0" y="210" width="200" height="58" fill="#000d1a" opacity="0.85"/>
  <line x1="14" y1="214" x2="186" y2="214" stroke="#1a6eff" stroke-width="1" opacity="0.7"/>

  <!-- Title -->
  <text x="100" y="235" text-anchor="middle"
    font-family="'Cinzel','Georgia',serif" font-size="26"
    font-weight="900" fill="#66aaff"
    stroke="#000d1a" stroke-width="3" paint-order="stroke">BLUE</text>
  <text x="100" y="257" text-anchor="middle"
    font-family="'Cinzel','Georgia',serif" font-size="26"
    font-weight="900" fill="#ffffff"
    stroke="#000d1a" stroke-width="3" paint-order="stroke">PERIOD</text>

  <!-- Author -->
  <text x="100" y="272" text-anchor="middle"
    font-family="'Rajdhani','Arial',sans-serif" font-size="9" fill="#66aaff" letter-spacing="1.5"
    opacity="0.85">TSUBASA YAMAGUCHI</text>

  <!-- Bottom bar -->
  <rect x="0" y="280" width="200" height="10" fill="#0055cc" opacity="0.8"/>
  <text x="100" y="288" text-anchor="middle" font-family="'Rajdhani','Arial',sans-serif"
    font-size="7" fill="#ffffff" font-weight="700" letter-spacing="2">MANGAVERSE • VOL. 1</text>
</svg>
